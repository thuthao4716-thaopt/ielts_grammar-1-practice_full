<!DOCTYPE html>
<html lang="vi">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    code, pre, .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    /* iPad Air 5 optimization (820px x 1180px) */
    @media (min-width: 768px) and (max-width: 1024px) {
      .ipad-touch-target {
        min-height: 48px;
        padding-top: 0.65rem;
        padding-bottom: 0.65rem;
      }
    }
    /* Interactive Highlight & Underline Classes */
    .hl-yellow {
      background-color: #fef08a;
      padding: 0.1rem 0.35rem;
      border-radius: 0.25rem;
      font-weight: 600;
      color: #854d0e;
    }
    .hl-emerald {
      background-color: #d1fae5;
      padding: 0.1rem 0.35rem;
      border-radius: 0.25rem;
      font-weight: 600;
      color: #065f46;
    }
    .hl-sky {
      background-color: #e0f2fe;
      padding: 0.1rem 0.35rem;
      border-radius: 0.25rem;
      font-weight: 600;
      color: #0369a1;
    }
    .rule-under {
      text-decoration-line: underline;
      text-decoration-thickness: 2.5px;
      text-underline-offset: 3px;
    }
    .rule-under-amber {
      text-decoration-color: #f59e0b;
    }
    .rule-under-blue {
      text-decoration-color: #3b82f6;
    }
    .rule-under-rose {
      text-decoration-color: #f43f5e;
    }
  </style>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col selection:bg-amber-200 selection:text-amber-900">

  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 shadow-xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button id="mobileMenuBtn" class="lg:hidden p-2 rounded-lg text-slate-600 hover:bg-slate-100 focus:outline-hidden" aria-label="Toggle menu">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="flex items-center gap-2">
          <span class="flex items-center justify-center w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 text-white font-extrabold text-lg shadow-sm">
            S+V
          </span>
          <div>
            <h1 class="font-bold text-base sm:text-lg leading-tight text-slate-900">IELTS Grammar Lab</h1>
            <p class="text-xs text-slate-500 font-medium hidden sm:block">Theo giáo trình IELTS Grammar - Ms Hoa</p>
          </div>
        </div>
      </div>

      <!-- Quick Search & Actions -->
      <div class="flex items-center gap-2 sm:gap-4">
        <div class="relative w-44 sm:w-64">
          <input type="text" id="lessonSearch" placeholder="Tìm bài học, chủ đề..." class="w-full pl-8 pr-3 py-1.5 text-xs sm:text-sm bg-slate-100 focus:bg-white border border-transparent focus:border-blue-400 rounded-lg outline-hidden transition">
          <svg class="w-4 h-4 text-slate-400 absolute left-2.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </div>

        <!-- Total Progress Pill -->
        <div class="hidden sm:flex items-center gap-2 bg-blue-50 border border-blue-200 text-blue-700 px-3 py-1 rounded-full text-xs font-semibold">
          <span id="globalScoreBadge">0 bài hoàn thành</span>
        </div>
      </div>
    </div>
  </header>

  <div class="flex-1 max-w-7xl w-full mx-auto flex overflow-hidden">
    
    <!-- Sidebar / Drawer (iPad & Desktop friendly) -->
    <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 z-40 w-72 lg:w-80 bg-white border-r border-slate-200 flex flex-col transition-transform transform -translate-x-full lg:translate-x-0 pt-16 lg:pt-0 shadow-lg lg:shadow-none">
      <div class="p-4 border-b border-slate-100 flex items-center justify-between">
        <span class="text-xs font-bold text-slate-400 tracking-wider uppercase">14 Bài Học Cốt Lõi</span>
        <button id="closeSidebarBtn" class="lg:hidden text-slate-400 hover:text-slate-600 p-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="lessonListNav" class="flex-1 overflow-y-auto p-3 space-y-1">
        <!-- Lessons rendered via JS -->
      </div>
      <div class="p-3 bg-slate-50 border-t border-slate-200 text-xs text-slate-500 text-center">
        💡 Chạm vào câu để xem giải thích chi tiết
      </div>
    </aside>

    <!-- Overlay for mobile/tablet sidebar -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-30 hidden lg:hidden"></div>

    <!-- Main Content Workspace -->
    <main class="flex-1 flex flex-col overflow-y-auto bg-slate-50 p-4 sm:p-6 lg:p-8">
      
      <!-- Top Topic Header & Mode Switcher -->
      <div class="bg-white rounded-2xl p-5 sm:p-6 border border-slate-200/80 shadow-xs mb-6">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
          <div>
            <div class="flex items-center gap-2 mb-1">
              <span id="lessonTag" class="px-2.5 py-0.5 text-xs font-bold bg-amber-100 text-amber-800 rounded-md">Lesson 2</span>
              <span id="lessonCategory" class="text-xs font-semibold text-slate-500">Từ Loại (Parts of Speech)</span>
            </div>
            <h2 id="lessonTitle" class="text-xl sm:text-2xl font-extrabold text-slate-900 tracking-tight">Danh Từ (Countable & Uncountable Nouns)</h2>
          </div>

          <!-- Mode Toggle: Lý Thuyết vs Luyện Tập -->
          <div class="inline-flex p-1 bg-slate-100 rounded-xl border border-slate-200 self-start md:self-center">
            <button id="tabTheory" class="tab-btn px-4 py-2 text-xs sm:text-sm font-bold rounded-lg transition bg-white text-blue-600 shadow-xs">
              📖 Bí Kíp & Công Thức
            </button>
            <button id="tabPractice" class="tab-btn px-4 py-2 text-xs sm:text-sm font-medium text-slate-600 rounded-lg hover:text-slate-900 transition">
              ✍️ Luyện Tập & Bài Tập
            </button>
          </div>
        </div>

        <!-- Highlight & Highlight toggle hints -->
        <div class="mt-4 pt-3 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2 text-xs text-slate-600">
          <div class="flex items-center gap-3">
            <span class="inline-flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span> Điểm mấu chốt</span>
            <span class="inline-flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-sky-400"></span> Quy tắc ngữ pháp</span>
            <span class="inline-flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-rose-400"></span> Cảnh báo bẫy thi</span>
          </div>
          <button id="toggleHighlightTipsBtn" class="text-blue-600 font-semibold hover:underline">
            Ẩn/Hiện Chú Giải Chi Tiết
          </button>
        </div>
      </div>

      <div id="theoryView" class="space-y-6">
        <!-- Rendered by JS based on current active lesson -->
      </div>

      <div id="practiceView" class="space-y-6 hidden">
        <!-- Rendered by JS based on current active lesson -->
      </div>

    </main>
  </div>

  <script>
    const LESSONS_DATA = [
      {
        id: 2,
        title: "Danh từ (Nouns)",
        subtitle: "Đếm được, không đếm được, Much/Many, Some/Any/A/An",
        category: "Từ loại",
        theory: `
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="p-4 bg-emerald-50/70 border border-emerald-200 rounded-xl">
              <h4 class="font-bold text-emerald-900 mb-2 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-500"></span> Countable (Đếm được)
              </h4>
              <p class="text-xs text-slate-700 leading-relaxed mb-3">
                Là những danh từ có thể đếm bằng số (1, 2, 3...) và có dạng số nhiều:
              </p>
              <div class="flex flex-wrap gap-1 text-xs">
                <span class="hl-emerald">apple</span>
                <span class="hl-emerald">chair</span>
                <span class="hl-emerald">car</span>
                <span class="hl-emerald">book</span>
                <span class="hl-emerald">table</span>
                <span class="hl-emerald">sandwich</span>
                <span class="hl-emerald">bottle</span>
                <span class="hl-emerald">idea</span>
              </div>
            </div>

            <div class="p-4 bg-rose-50/70 border border-rose-200 rounded-xl">
              <h4 class="font-bold text-rose-900 mb-2 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-rose-500"></span> Uncountable (Không đếm được)
              </h4>
              <p class="text-xs text-slate-700 leading-relaxed mb-3">
                Không thể đếm trực tiếp bằng số, <u class="rule-under rule-under-rose font-semibold">luôn đi với động từ số ít</u>:
              </p>
              <div class="flex flex-wrap gap-1 text-xs">
                <span class="px-2 py-0.5 bg-rose-100 text-rose-800 rounded">water</span>
                <span class="px-2 py-0.5 bg-rose-100 text-rose-800 rounded">advice</span>
                <span class="px-2 py-0.5 bg-rose-100 text-rose-800 rounded">information</span>
                <span class="px-2 py-0.5 bg-rose-100 text-rose-800 rounded">bread</span>
                <span class="px-2 py-0.5 bg-rose-100 text-rose-800 rounded">luggage</span>
                <span class="px-2 py-0.5 bg-rose-100 text-rose-800 rounded">furniture</span>
                <span class="px-2 py-0.5 bg-rose-100 text-rose-800 rounded">money</span>
                <span class="px-2 py-0.5 bg-rose-100 text-rose-800 rounded">homework</span>
              </div>
            </div>

            <div class="p-4 bg-amber-50/70 border border-amber-200 rounded-xl">
              <h4 class="font-bold text-amber-900 mb-2 flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-amber-500"></span> Both (Vừa đếm vừa không)
              </h4>
              <p class="text-xs text-slate-700 leading-relaxed mb-2">Thay đổi ngữ nghĩa theo ngữ cảnh cụ thể:</p>
              <ul class="text-xs space-y-1.5 text-slate-800">
                <li>• <b>experience</b>: Kinh nghiệm (uncount) | Trải nghiệm cụ thể (count)</li>
                <li>• <b>light</b>: Ánh sáng (uncount) | Chiếc đèn (count)</li>
                <li>• <b>coffee</b>: Cà phê nói chung (uncount) | 1 tách cà phê (count)</li>
                <li>• <b>business</b>: Việc kinh doanh (uncount) | Doanh nghiệp (count)</li>
                <li>• <b>time</b>: Thời gian (uncount) | Số lần (count)</li>
              </ul>
            </div>
          </div>

          <div class="mt-4 p-4 bg-white border border-slate-200 rounded-xl shadow-xs">
            <h4 class="font-bold text-slate-900 text-sm mb-3">📌 Quy tắc cốt lõi: Much vs Many & Some vs Any vs A/An</h4>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 text-xs">
              <div class="p-3 bg-slate-50 rounded-lg border border-slate-200">
                <b class="text-blue-700 block mb-1">MUCH</b>
                Dùng với <u class="rule-under rule-under-blue">danh từ không đếm được</u> trong câu phủ định & nghi vấn.<br>
                <i>Ví dụ: We don't have <span class="hl-yellow">much time</span>.</i>
              </div>
              <div class="p-3 bg-slate-50 rounded-lg border border-slate-200">
                <b class="text-blue-700 block mb-1">MANY</b>
                Dùng với <u class="rule-under rule-under-blue">danh từ đếm được số nhiều</u>.<br>
                <i>Ví dụ: How <span class="hl-yellow">many people</span> are there?</i>
              </div>
              <div class="p-3 bg-slate-50 rounded-lg border border-slate-200">
                <b class="text-blue-700 block mb-1">SOME / ANY / A / AN</b>
                • <b>SOME</b>: Câu khẳng định, lời mời lịch sự.<br>
                • <b>ANY</b>: Câu phủ định & câu hỏi.<br>
                • <b>A / AN</b>: Danh từ đếm được số ít (A trước phụ âm, An trước nguyên âm).
              </div>
            </div>
          </div>
        `,
        exercises: [
          {
            type: "sort",
            title: "Bài 1. Phân loại danh từ vào 3 nhóm",
            instruction: "Bấm vào từ vựng để chuyển sang cột thích hợp (Countable / Uncountable / Both):",
            items: [
              { word: "apple", cat: "count" },
              { word: "water", cat: "uncount" },
              { word: "experience", cat: "both" },
              { word: "chair", cat: "count" },
              { word: "advice", cat: "uncount" },
              { word: "light", cat: "both" },
              { word: "information", cat: "uncount" },
              { word: "car", cat: "count" },
              { word: "coffee", cat: "both" },
              { word: "luggage", cat: "uncount" },
              { word: "business", cat: "both" },
              { word: "time", cat: "both" },
              { word: "furniture", cat: "uncount" },
              { word: "homework", cat: "uncount" }
            ]
          },
          {
            type: "fill",
            title: "Bài 2: Điền Much hoặc Many",
            instruction: "Điền 'much' hoặc 'many' vào chỗ trống thích hợp:",
            questions: [
              { q: "1. There are not _____ shops in my town.", a: "many", exp: "shops là danh từ đếm được số nhiều." },
              { q: "2. We don't have _____ time.", a: "much", exp: "time (thời gian) là danh từ không đếm được." },
              { q: "3. How _____ people are there in your family?", a: "many", exp: "people là danh từ số nhiều của person." },
              { q: "4. How _____ sugar do you want in your coffee?", a: "much", exp: "sugar (đường) là danh từ không đếm được." },
              { q: "5. How _____ stars are there in the night sky?", a: "many", exp: "stars là danh từ đếm được số nhiều." },
              { q: "6. I don't know _____ about her.", a: "much", exp: "know much (biết nhiều) bổ trợ cho hành động/thông tin." }
            ]
          },
          {
            type: "fill",
            title: "Bài 3. Hoàn thành với some, any hoặc a/an",
            instruction: "Chọn hoặc nhập 'some', 'any', 'a', hoặc 'an':",
            questions: [
              { q: "1. I don't have _____ close friends.", a: "any", exp: "Câu phủ định dùng 'any'." },
              { q: "2. _____ people believe that money is everything.", a: "Some", exp: "Câu khẳng định dùng 'Some'." },
              { q: "3. My father is _____ engineer, and my mother is a doctor.", a: "an", exp: "engineer bắt đầu bằng nguyên âm 'e' nên dùng 'an'." },
              { q: "4. Do you have _____ money? Can you lend me some?", a: "any", exp: "Câu hỏi thông thường dùng 'any', vế sau là lời yêu cầu mượn dùng 'some'." },
              { q: "5. There is _____ orange juice in the fridge.", a: "some", exp: "orange juice là danh từ không đếm được trong câu khẳng định → dùng 'some'." }
            ]
          }
        ]
      },
      {
        id: 3,
        title: "Động từ (Verbs)",
        subtitle: "To-V, V-ing, Bare Inf & Các động từ đổi nghĩa (Stop, Remember...)",
        category: "Từ loại",
        theory: `
          <div class="space-y-4 text-xs sm:text-sm">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="p-4 bg-sky-50 border border-sky-200 rounded-xl">
                <h4 class="font-bold text-sky-900 mb-2">🎯 Động từ đi với TO-V</h4>
                <p class="text-xs text-slate-600 mb-2">Thường mang ý định, hướng tới tương lai hoặc nỗ lực:</p>
                <div class="flex flex-wrap gap-1 text-xs">
                  <span class="hl-sky">manage to V</span>
                  <span class="hl-sky">hope to V</span>
                  <span class="hl-sky">expect to V</span>
                  <span class="hl-sky">decide to V</span>
                  <span class="hl-sky">promise to V</span>
                  <span class="hl-sky">refuse to V</span>
                </div>
              </div>

              <div class="p-4 bg-amber-50 border border-amber-200 rounded-xl">
                <h4 class="font-bold text-amber-900 mb-2">💡 Động từ đi với V-ING</h4>
                <p class="text-xs text-slate-600 mb-2">Thường diễn tả sở thích, thói quen hoặc hành động đang/đã trải qua:</p>
                <div class="flex flex-wrap gap-1 text-xs">
                  <span class="hl-yellow">enjoy V-ing</span>
                  <span class="hl-yellow">miss V-ing</span>
                  <span class="hl-yellow">imagine V-ing</span>
                  <span class="hl-yellow">avoid V-ing</span>
                  <span class="hl-yellow">admit V-ing</span>
                </div>
              </div>
            </div>

            <!-- Nuances Box -->
            <div class="p-4 bg-white border border-slate-200 rounded-xl">
              <h4 class="font-bold text-slate-900 text-sm mb-3">🔥 Các cặp động từ đặc biệt DỄ GÂY NHẦM LẪN (Must Learn)</h4>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                <div class="p-2.5 bg-slate-50 rounded-lg">
                  <b class="text-blue-700">REMEMBER / FORGET</b>
                  <p>• <u class="rule-under rule-under-amber">+ To-V</u>: Nhớ/Quên <b>phải làm việc gì</b> (chưa làm).<br>
                  • <u class="rule-under rule-under-blue">+ V-ing</u>: Nhớ/Quên <b>đã làm việc gì rồi</b> (ký ức quá khứ).</p>
                </div>
                <div class="p-2.5 bg-slate-50 rounded-lg">
                  <b class="text-blue-700">STOP</b>
                  <p>• <u class="rule-under rule-under-amber">+ To-V</u>: Dừng lại <b>để làm một việc khác</b>.<br>
                  • <u class="rule-under rule-under-blue">+ V-ing</u>: Dừng hẳn <b>hành động đang làm</b>.</p>
                </div>
                <div class="p-2.5 bg-slate-50 rounded-lg">
                  <b class="text-blue-700">TRY</b>
                  <p>• <u class="rule-under rule-under-amber">+ To-V</u>: Cố gắng hết sức làm việc gì đó.<br>
                  • <u class="rule-under rule-under-blue">+ V-ing</u>: Thử nghiệm làm việc gì đó.</p>
                </div>
                <div class="p-2.5 bg-slate-50 rounded-lg">
                  <b class="text-blue-700">SEE / WATCH SOMEONE</b>
                  <p>• <u class="rule-under rule-under-amber">+ V (nguyên mẫu)</u>: Thấy toàn bộ hành động từ đầu đến cuối.<br>
                  • <u class="rule-under rule-under-blue">+ V-ing</u>: Thấy hành động đang diễn ra hoặc thói quen thường xuyên.</p>
                </div>
              </div>
            </div>
          </div>
        `,
        exercises: [
          {
            type: "fill",
            title: "Bài 1 & 4. Luyện tập To-V và V-ing theo ngữ cảnh",
            instruction: "Điền dạng đúng của động từ trong ngoặc (To V hoặc V-ing):",
            questions: [
              { q: "1. I usually wake up at 6:30 and try _____ (not hit) the snooze button.", a: "not to hit", exp: "try to do something: cố gắng làm gì (dạng phủ định: try not to do)." },

              `).join('')}
            </div>
          `;
        }

        exBox.innerHTML = headerHtml + contentHtml;
        practiceView.appendChild(exBox);
      });
    }

    function normalizeStr(str) {
      return (str || "").toLowerCase().trim().replace(/[.,/#!$%^&*;:{}=\-_`~()]/g, "").replace(/\s+/g, " ");
    }

    window.checkFillAnswer = function(exIdx, qIdx, encodedAns, encodedExp) {
      const correctAns = decodeURIComponent(encodedAns);
      const explanation = decodeURIComponent(encodedExp);
      const inputEl = document.getElementById(`input_${exIdx}_${qIdx}`);
      const feedbackEl = document.getElementById(`feedback_${exIdx}_${qIdx}`);
      const userVal = inputEl.value.trim();

      if (!userVal) {
        feedbackEl.className = "text-xs p-2.5 rounded-lg bg-amber-50 text-amber-800 border border-amber-200 block";
        feedbackEl.innerHTML = "⚠️ Vui lòng nhập đáp án trước khi kiểm tra!";
        return;
      }

      // Check equivalency (supports multiple forms like Ø or 0)
      const normUser = normalizeStr(userVal);
      const normCorrect = normalizeStr(correctAns);

      const isZero = (normCorrect === "ø" || normCorrect === "0" || normCorrect === "") && (normUser === "0" || normUser === "ø" || normUser === "none");
      const isCorrect = (normUser === normCorrect) || isZero;

      feedbackEl.classList.remove('hidden');
      if (isCorrect) {
        feedbackEl.className = "text-xs p-2.5 rounded-lg bg-emerald-50 text-emerald-800 border border-emerald-200 block";
        feedbackEl.innerHTML = `
          <div class="font-bold flex items-center gap-1">✅ Chính xác! Tuyệt vời!</div>
          <div class="mt-1 text-slate-600"><b>Giải thích:</b> ${explanation}</div>
        `;
        inputEl.classList.add('border-emerald-500', 'bg-emerald-50/30');
        triggerConfettiMini();
        recordProgress();
      } else {
        feedbackEl.className = "text-xs p-2.5 rounded-lg bg-rose-50 text-rose-800 border border-rose-200 block";
        feedbackEl.innerHTML = `
          <div class="font-bold flex items-center gap-1">❌ Chưa chính xác!</div>
          <div class="mt-0.5">Đáp án đúng là: <span class="font-mono font-bold text-rose-900 bg-rose-100 px-1.5 py-0.5 rounded">${correctAns}</span></div>
          <div class="mt-1 text-slate-600"><b>Giải thích:</b> ${explanation}</div>
        `;
      }
    };

    window.checkChoiceAnswer = function(btnEl, exIdx, qIdx, encodedChoice, encodedAns, encodedExp) {
      const choice = decodeURIComponent(encodedChoice);
      const correctAns = decodeURIComponent(encodedAns);
      const exp = decodeURIComponent(encodedExp);
      const parentContainer = btnEl.parentElement;
      const feedbackEl = document.getElementById(`feedback_${exIdx}_${qIdx}`);

      // Disable all other buttons in this question
      parentContainer.querySelectorAll('.choice-btn').forEach(b => {
        b.disabled = true;
        b.classList.remove('hover:border-blue-400');
      });

      feedbackEl.classList.remove('hidden');
      if (choice === correctAns) {
        btnEl.classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-800', 'font-bold');
        feedbackEl.className = "text-xs p-2.5 rounded-lg bg-emerald-50 text-emerald-800 border border-emerald-200 block";
        feedbackEl.innerHTML = `<b>✅ Tuyệt vời!</b> ${exp}`;
        triggerConfettiMini();
        recordProgress();
      } else {
        btnEl.classList.add('bg-rose-50', 'border-rose-500', 'text-rose-800');
        // Highlight correct button
        parentContainer.querySelectorAll('.choice-btn').forEach(b => {
          if (b.textContent.trim() === correctAns) {
            b.classList.add('bg-emerald-50', 'border-emerald-500', 'text-emerald-800', 'font-bold');
          }
        });
        feedbackEl.className = "text-xs p-2.5 rounded-lg bg-rose-50 text-rose-800 border border-rose-200 block";
        feedbackEl.innerHTML = `<b>❌ Chưa đúng!</b> Đáp án chuẩn: <span class="font-semibold">${correctAns}</span>. <br>${exp}`;
      }
    };

    window.handleSortChipClick = function(word, cat, exIndex, chipIdx) {
      const chip = document.getElementById(`chip_${exIndex}_${chipIdx}`);
      if (!chip) return;

      const targetBucket = document.getElementById(`bucket_${cat}_${exIndex}`);
      chip.remove();

      const badge = document.createElement('span');
      badge.className = `px-2 py-1 text-xs font-semibold rounded-md shadow-2xs animate-fade-in ${
        cat === 'count' ? 'bg-emerald-100 text-emerald-800' :
        cat === 'uncount' ? 'bg-rose-100 text-rose-800' :
        'bg-amber-100 text-amber-800'
      }`;
      badge.textContent = word;
      targetBucket.appendChild(badge);

      triggerConfettiMini();
      recordProgress();
    };

    function triggerConfettiMini() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 25,
          spread: 45,
          origin: { y: 0.85 }
        });
      }
    }

    function recordProgress() {
      if (!userProgress[currentLessonId]) {
        userProgress[currentLessonId] = { answered: 0, completed: false };
      }
      userProgress[currentLessonId].answered += 1;
      if (userProgress[currentLessonId].answered >= 3) {
        userProgress[currentLessonId].completed = true;
      }
      localStorage.setItem('ielts_grammar_progress', JSON.stringify(userProgress));
      updateGlobalProgress();
    }

    function updateGlobalProgress() {
      const totalCompleted = Object.values(userProgress).filter(p => p.completed).length;
      globalScoreBadge.textContent = `${totalCompleted} / 14 Bài đã luyện xong`;
    }

    // Switch View Tabs
    function switchView(mode) {
      currentViewMode = mode;
      if (mode === 'theory') {
        tabTheory.className = "tab-btn px-4 py-2 text-xs sm:text-sm font-bold rounded-lg transition bg-white text-blue-600 shadow-xs";
        tabPractice.className = "tab-btn px-4 py-2 text-xs sm:text-sm font-medium text-slate-600 rounded-lg hover:text-slate-900 transition";
        theoryView.classList.remove('hidden');
        practiceView.classList.add('hidden');
      } else {
        tabPractice.className = "tab-btn px-4 py-2 text-xs sm:text-sm font-bold rounded-lg transition bg-white text-blue-600 shadow-xs";
        tabTheory.className = "tab-btn px-4 py-2 text-xs sm:text-sm font-medium text-slate-600 rounded-lg hover:text-slate-900 transition";
        practiceView.classList.remove('hidden');
        theoryView.classList.add('hidden');
      }
    }

    tabTheory.onclick = () => switchView('theory');
    tabPractice.onclick = () => switchView('practice');

    // Sidebar Interactions (Mobile & iPad)
    function openSidebar() {
      sidebar.classList.remove('-translate-x-full');
      sidebarOverlay.classList.remove('hidden');
    }
    function closeSidebar() {
      sidebar.classList.add('-translate-x-full');
      sidebarOverlay.classList.add('hidden');
    }

    mobileMenuBtn.onclick = openSidebar;
    closeSidebarBtn.onclick = closeSidebar;
    sidebarOverlay.onclick = closeSidebar;

    // Search filter
    lessonSearch.oninput = (e) => {
      renderLessonNavigation(e.target.value);
    };

    // Initialize App
    window.addEventListener('DOMContentLoaded', () => {
      renderLessonNavigation();
      selectLesson(2);
    });
  </script>
</body>
</html>
